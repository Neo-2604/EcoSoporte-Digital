{% extends "base.html" %}{% block title %}Nueva empresa{% endblock %}
{% block content %}<div class="heading"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1>Registrar empresa</h1></div></div><form class="panel form" method="post">
<h2>Información general</h2><div class="grid2"><label>Nombre de empresa *<input name="nombre" required></label><label>NIT<input name="nit"></label><label>Tipo<input name="tipo"></label><label>Sector<input name="sector"></label><label>Email<input type="email" name="email"></label><label>Teléfono<input name="telefono"></label><label>Sitio web<input name="sitio_web"></label></div>
<h2>Ubicación</h2><div class="grid2"><label>Departamento<input name="departamento"></label><label>Ciudad<input name="ciudad"></label><label>Localidad/Municipio<input name="localidad"></label><label>Dirección<input name="direccion"></label><label>Barrio<input name="barrio"></label><label>Código postal<input name="codigo_postal"></label></div>
<h2>Contacto</h2><div class="grid2"><label>Nombre contacto<input name="contacto_nombre"></label><label>Cargo<input name="contacto_cargo"></label><label>Teléfono contacto<input name="contacto_telefono"></label><label>Email contacto<input name="contacto_email"></label><label>Medio preferido<input name="medio_contacto"></label></div>
<h2>Soporte e infraestructura</h2><div class="grid2"><label>Horario atención<input name="horario_atencion"></label><label>Horario soporte<input name="horario_soporte"></label><label>Empleados<input type="number" name="empleados"></label><label>Equipos aproximados<input type="number" name="equipos_aprox"></label><label>Infraestructura<input name="infraestructura"></label><label>Servidor<input name="servidor"></label><label>Red interna<input name="red_interna"></label><label>Wi-Fi<input name="wifi"></label><label>Nube<input name="nube"></label><label>Sistemas y apps<input name="sistemas"></label></div><label>Observaciones<textarea name="observaciones"></textarea></label><button class="btn primary">Guardar empresa</button></form>{% endblock %}
