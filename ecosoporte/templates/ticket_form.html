{% extends "base.html" %}{% block title %}Crear ticket{% endblock %}
{% block content %}<div class="heading"><div><span class="eyebrow">MESA DE AYUDA</span><h1>Crear solicitud</h1></div></div><form class="panel form" method="post"><label>Título<input name="titulo" required placeholder="Ej. Equipo no enciende"></label><label>Descripción<textarea name="descripcion" required placeholder="Describe el problema con el mayor detalle posible."></textarea></label><div class="grid2"><label>Categoría<select name="categoria">{% for c in categories %}<option>{{c.nombre}}</option>{% endfor %}</select></label><label>Prioridad<select name="prioridad">{% for p in priorities %}<option>{{p.nombre}}</option>{% endfor %}</select></label></div><button class="btn primary">Crear ticket</button></form>{% endblock %}
