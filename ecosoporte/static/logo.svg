<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0dd5ad" />
      <stop offset="100%" stop-color="#24b47e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0dd5ad" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="22" fill="url(#ecoGrad)" />
    <!-- Tech Leaf Concept -->
    <path d="M 58 22 C 38 22, 24 36, 24 56 C 24 64, 30 70, 38 70 C 58 70, 72 56, 72 36 C 72 28, 66 22, 58 22 Z" fill="#0b171a" opacity="0.15" />
    <path d="M 56 26 C 38 26, 26 38, 26 54 C 38 54, 56 48, 56 26 Z" fill="#ffffff" />
    <circle cx="58" cy="26" r="5" fill="url(#cyanGrad)" filter="url(#glow)" />
    <path d="M 32 54 Q 44 54 54 44" stroke="#0dd5ad" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Brand Text -->
  <text x="106" y="50" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="-0.5">
    Eco<tspan fill="url(#cyanGrad)">Soporte</tspan>
  </text>
  <text x="106" y="70" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="13" fill="#9bb3b8" letter-spacing="3.5">
    DIGITAL
  </text>
</svg>
