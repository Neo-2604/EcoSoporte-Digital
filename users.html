{% extends "base.html" %}{% block title %}Usuarios{% endblock %}
{% block content %}<div class="heading"><div><span class="eyebrow">ADMINISTRACIÓN</span><h1>Usuarios</h1></div></div>
<section class="panel form"><h2>Crear usuario</h2><form method="post"><div class="grid2"><label>Nombre<input name="nombre" required></label><label>Correo<input type="email" name="email" required></label><label>Contraseña<input type="password" name="password" required></label><label>Rol<select name="role"><option>CLIENTE</option><option>TECNICO_NIVEL_1</option><option>TECNICO_NIVEL_2</option><option>TECNICO_NIVEL_3</option></select></label></div><button class="btn primary">Crear</button></form></section>
<section class="panel"><h2>Usuarios registrados</h2><div class="table-wrap"><table><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acción</th></tr>{% for u in users %}<tr><td>{{u.nombre}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{u.estado}}</td><td><form method="post" action="{{url_for('admin.toggle_user',user_id=u.id)}}"><button class="btn small">{{'Desactivar' if u.estado=='ACTIVO' else 'Activar'}}</button></form></td></tr>{% endfor %}</table></div></section>{% endblock %}
